name: Enrich Open Design catalog from pinned source
on:
  workflow_dispatch:
jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: feimacode/open-design-agent-kit
          ref: 1b3832c3452720f028a96b1bdab805ecc1aa3213
          path: upstream
          sparse-checkout: |
            claude-design-systems
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich and verify source-pinned design systems
        working-directory: catalog-repo
        run: |
          python scripts/enrich_open_design.py --upstream-root ../upstream
          python -m unittest discover -s tests -v
      - name: Check for catalog drift (no remote writes)
        working-directory: catalog-repo
        run: |
          git diff --exit-code -- .
