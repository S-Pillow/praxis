name: Enrich Hallmark theme tokens from pinned source
on:
  workflow_dispatch:
jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nutlope/hallmark
          ref: 04977e15f3dfd6ee4b74c887dac3eb52665d6c92
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/themes/*/tokens.css
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich source-pinned CSS tokens and validate
        working-directory: catalog-repo
        run: |
          python scripts/enrich_hallmark_tokens.py --upstream-root ../upstream
          python -m unittest discover -s tests -v
      - name: Check for catalog drift (no remote writes)
        working-directory: catalog-repo
        run: |
          git diff --exit-code -- .
