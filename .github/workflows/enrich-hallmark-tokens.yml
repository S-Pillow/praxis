name: Enrich Hallmark theme tokens from pinned source
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_hallmark_tokens.py
      - .github/workflows/enrich-hallmark-tokens.yml
  workflow_dispatch:
jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog-repo
      - uses: actions/checkout@v4
        with:
          repository: Nutlope/hallmark
          ref: 04977e15f3dfd6ee4b74c887dac3eb52665d6c92
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/themes/*/tokens.css
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich source-pinned CSS tokens and validate
        working-directory: catalog-repo
        run: |
          python scripts/enrich_hallmark_tokens.py --upstream-root ../upstream
          python -m unittest discover -s tests -v
      - name: Commit metadata only
        working-directory: catalog-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/entries/hallmark-themes.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "catalog: capture all 50 Hallmark theme CSS token sets"
          git push origin HEAD:main
