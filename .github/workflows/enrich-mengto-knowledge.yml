name: Enrich MengTo knowledge from pinned source
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_mengto_knowledge.py
      - .github/workflows/enrich-mengto-knowledge.yml
  workflow_dispatch:
jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog-repo
      - uses: actions/checkout@v4
        with:
          repository: MengTo/Skills
          ref: 3cc93458c4949c39a04e938ea7892a1d6d3d40bf
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /agent-skills/web-design/*/SKILL.md
            /agent-skills/ui/*/SKILL.md
            /agent-skills/3d/*/SKILL.md
            /agent-skills/codex/*/SKILL.md
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source metadata and run full validation
        working-directory: catalog-repo
        run: |
          python scripts/enrich_mengto_knowledge.py --upstream-root ../upstream
          python -m unittest discover -s tests -v
      - name: Commit verified metadata only
        working-directory: catalog-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/entries/mengto-design-knowledge.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "catalog: enrich 123 MengTo knowledge descriptions from pinned source"
          git push origin HEAD:main
