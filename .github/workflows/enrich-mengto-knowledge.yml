name: Enrich MengTo knowledge from pinned source
on:
  workflow_dispatch:
jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MengTo/Skills
          ref: 3cc93458c4949c39a04e938ea7892a1d6d3d40bf
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /agent-skills/web-design/*/SKILL.md
            /agent-skills/ui/*/SKILL.md
            /agent-skills/3d/*/SKILL.md
            /agent-skills/codex/*/SKILL.md
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source metadata and run full validation
        working-directory: catalog-repo
        run: |
          python scripts/enrich_mengto_knowledge.py --upstream-root ../upstream
          python -m unittest discover -s tests -v
      - name: Check for catalog drift (no remote writes)
        working-directory: catalog-repo
        run: |
          git diff --exit-code -- .
