name: Catalog validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'packaging/**'
      - 'catalog/**'
      - 'ui/**'
      - 'skills/**'
      - 'knowledge/**'
      - 'scripts/**'
      - 'framework/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'tests/**'
      - '.github/workflows/catalog-validation.yml'
      - '.github/workflows/enrich-*.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'packaging/**'
      - 'catalog/**'
      - 'ui/**'
      - 'skills/**'
      - 'knowledge/**'
      - 'scripts/**'
      - 'framework/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'tests/**'
      - '.github/workflows/catalog-validation.yml'
      - '.github/workflows/enrich-*.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate imported catalog
        run: python -m unittest discover -s tests -v
  validate-windows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate imported catalog and specialists
        run: python -m unittest discover -s tests -v
