name: Enrich Open Design references from pinned source
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_open_design_references.py
      - .github/workflows/enrich-open-design-references.yml
  workflow_dispatch:
jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog-repo
      - uses: actions/checkout@v4
        with:
          repository: feimacode/open-design-agent-kit
          ref: 1b3832c3452720f028a96b1bdab805ecc1aa3213
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /packages/content/assets/open-design/design-templates/*/SKILL.md
            /packages/content/assets/open-design/examples/*/open-design.json
            /packages/content/assets/open-design/examples/*/example.html
            /packages/content/assets/open-design/skills/*/SKILL.md
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich source descriptions and validate
        working-directory: catalog-repo
        run: |
          python scripts/enrich_open_design_references.py --upstream-root ../upstream
          python -m unittest discover -s tests -v
      - name: Commit verified metadata only
        working-directory: catalog-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/entries/open-design-templates.json catalog/entries/open-design-examples.json catalog/entries/open-design-skills.json
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git commit -m "catalog: enrich Open Design template example and skill descriptions"
          git push origin HEAD:main
